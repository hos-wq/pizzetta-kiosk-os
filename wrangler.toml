name = "pizzetta-kiosk-os"
main = "apps/worker/src/pizzetta-index-v3.ts"
compatibility_date = "2026-10-05"

[vars]
ENVIRONMENT = "local"
PIZZETTA_OWNER_EMAIL = "otherbadhabits.makati@gmail.com"
GOOGLE_CLIENT_ID = "642194379481-3dlj9q9n12mjn8lldipp1d4tsoqiucsm.apps.googleusercontent.com"
META_APP_ID = "1106040422306141"
META_GRAPH_VERSION = "v24.0"
PUBLIC_ORIGIN = "https://pizzetta-kiosk-os.pizzetta-kiosk.workers.dev"

[secrets]
required = ["GOOGLE_CLIENT_SECRET", "AUTH_SESSION_SECRET"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "pizzetta-kiosk-os"
database_id = "5b442bf4-52e1-4677-b712-04a51e8dec6a"
migrations_dir = "db/pizzetta-migrations"

[[durable_objects.bindings]]
name = "PIZZETTA_REALTIME"
class_name = "PizzettaRealtime"

[[migrations]]
tag = "realtime-v1"
new_sqlite_classes = ["PizzettaRealtime"]
