      "markdown": "Hawaiian.\n\nClassic.\n\n14.\n\nPIZZA: Hawaiian\nSIZE INCHES: 14\nRECIPE: Small irregular drained pineapple tidbits and thin small near-triangular pieces of industrial cooked ham, distributed naturally, baked in cheese. Dried oregano after baking.\nINGREDIENT QUANTITY / TOMATO: 80\nINGREDIENT QUANTITY / MOZZARELLA: 100\nINGREDIENT QUANTITY / DEL MONTE CANNED PINEAPPLE TIDBITS: 60\nINGREDIENT QUANTITY / INDUSTRIAL COOKED HAM: 60\nINGREDIENT QUANTITY / DRIED OREGANO: sprinkle\nINGREDIENT QUANTITY / DOUGH G: 300.\n\nDOUGH: Hand-tossed, slightly oval, organically irregular pizza, very thin but structurally supported center, a distinctly thick, tall, airy Neapolitan cornicione with a substantial raised outer shoulder and an open, naturally fermented interior. Preserve generous rim height and rounded volume rather than flattening or thinning the border. The rim rises unevenly: several strongly puffed sections with large irregular air pockets alternate with lower but still visibly thick sections, transitioning organically without becoming a uniform inflated tube. High-temperature baking produces clearly visible authentic leopard spotting: scattered irregular near-black charred blisters and dark-brown scorched spots with crisp edges, varying in size and spacing across the upper rim and outer shoulder, contrasted against predominantly golden-amber baked crust. The dark char marks must read distinctly as real heat blistering, not just golden freckles, printed dots, or continuous black bands. Satin slightly oily surface, no flour residue. Gas oven around 500°C. 8-inch has proportionally thicker/taller rim than 14-inch.\nTOMATO SAUCE (ONLY WHEN SPECIFIED BY THIS PRODUCT RECIPE): hand-crushed peeled tomatoes baked fully on the pizza; visibly cooked-down and concentrated, darker deep brick-red color, nearly dry surface with minimal free moisture, soft reduced irregular tomato texture bonded to melted cheese and baked dough, no fresh wet peeled-tomato chunks, no raw bright-red diced tomato, no watery juice pools; not burnt, blackened, or smooth puree.\nMOZZARELLA: Real block mozzarella, naturally melted, softly bubbled, with occasional golden to dark Maillard spots, no exaggerated cheese pulls.\nTOPPINGS: Ingredients added before baking are hand-distributed naturally unevenly, with some edges partially submerged in melted mozzarella. Cold toppings added after baking remain distinct, resting naturally on the hot cheese.\n\nBefore baking apply PIZZETTA signature garlic margarine over the entire outer cornicione, including its upper and outside-facing dough surface, producing golden satin surface with small irregular blisters; never a postbake brush. Apply garlic margarine to pizza CENTER ONLY if explicitly present in this pizza recipe. No implied base ingredient.\n\nSUBJECT_GEOMETRY | pizza_style=traditional_neapolitan; nominal_diameter_cm=35.56; visual_disc_scale=large; disc_profile=wide_and_thin; dressed_center=expansive; cornicione_radial_width=moderately_broad_locked; cornicione_vertical_profile=clearly_raised_locked; cornicione_internal_structure=airy_soft; cornicione_surface=natural_irregular; cornicione_front_height=physically_raised; RELATIVE_VISUAL_SCALE | pizza_disc_is_primary_scale_anchor; individual_topping_piece_scale=recipe_specific_consistent_across_whole_pizza_views; topping_clusters=small_separate_natural; mozzarella_piece_footprint=small_relative_to_disc; leafy_topping_piece_footprint=small_relative_to_disc; protein_and_vegetable_piece_footprint=recipe_specific_consistent_across_whole_pizza_views; topping_distribution=spread_across_expansive_center_naturally_irregular; topping_density=recipe_consistent; ingredient_types=exact_recipe; ingredient_quantities=exact_recipe; no_enlarged_hero_toppings=true; EXCLUDE | oversized_individual_toppings,oversized_topping_clusters,flat_compressed_rim,oversized_canotto_ring,uniform_bread_tube; PRESERVE | cornicione_radial_width=true; cornicione_vertical_height=true; cornic       "markdown": "Chicken Masala.\n\nSignature.\n\n8.\n\nPIZZA: Chicken Masala\nSIZE INCHES: 8\nRECIPE: BASE SAUCE — MASALA, NOT PLAIN TOMATO: A smooth, thick, fully blended and emulsified masala sauce made from concentrated tomato paste, margarine and a fine mixed masala spice blend. The finished sauce is a cohesive warm orange-red, buttery, opaque, even-textured layer, with fine dispersed spice pigments but no visible tomato chunks, raw tomato pieces, coarse vegetable fragments or discrete spice piles. Garlic margarine is applied directly on the dough first; the prepared masala sauce is evenly spread over it as the ONLY red base, beneath the mozzarella. The mozzarella partially melts over and into the sauce during baking. There is NO separate crushed-tomato or conventional tomato pizza sauce layer beneath the mozzarella. Breast fillets marinated in masala, GRILLED, then knife-cut into irregular bite-sized pieces. White onion cut into irregular bell-pepper-like strips/pieces; both baked partly submerged in cheese. Yogurt sauce = 50% yogurt blended with garlic + 50% mayonnaise, squeezed AFTER baking in clearly thicker, broader, more substantial finishing ribbons, opaque and visible, not in thin delicate lines. Finely sliced fresh onion leeks AFTER baking.\nINGREDIENT QUANTITY / GARLIC MARGARINE: base quantity unverified\nINGREDIENT QUANTITY / TOMATO MASALA SAUCE: 30\nINGREDIENT QUANTITY / MOZZARELLA: 30\nINGREDIENT QUANTITY / MASALA CHICKEN BREAST: 50\nINGREDIENT QUANTITY / WHITE ONION: 10\nINGREDIENT QUANTITY / YOGURT SAUCE: 10\nINGREDIENT QUANTITY / ONION LEEKS: 5\nINGREDIENT QUANTITY / DOUGH G: 150.\n\nDOUGH: Hand-tossed, slightly oval, organically irregular pizza, very thin but structurally supported center, a distinctly thick, tall, airy Neapolitan cornicione with a substantial raised outer shoulder and an open, naturally fermented interior. Preserve generous rim height and rounded volume rather than flattening or thinning the border. The rim rises unevenly: several strongly puffed sections with large irregular air pockets alternate with lower but still visibly thick sections, transitioning organically without becoming a uniform inflated tube. High-temperature baking produces clearly visible authentic leopard spotting: scattered irregular near-black charred blisters and dark-brown scorched spots with crisp edges, varying in size and spacing across the upper rim and outer shoulder, contrasted against predominantly golden-amber baked crust. The dark char marks must read distinctly as real heat blistering, not just golden freckles, printed dots, or continuous black bands. Satin slightly oily surface, no flour residue. Gas oven around 500°C. 8-inch has proportionally thicker/taller rim than 14-inch.\nTOMATO SAUCE (ONLY WHEN SPECIFIED BY THIS PRODUCT RECIPE): hand-crushed peeled tomatoes baked fully on the pizza; visibly cooked-down and concentrated, darker deep brick-red color, nearly dry surface with minimal free moisture, soft reduced irregular tomato texture bonded to melted cheese and baked dough, no fresh wet peeled-tomato chunks, no raw bright-red diced tomato, no watery juice pools; not burnt, blackened, or smooth puree.\nMOZZARELLA: Real block mozzarella, naturally melted, softly bubbled, with occasional golden to dark Maillard spots, no exaggerated cheese pulls.\nTOPPINGS: Ingredients added before baking are hand-distributed naturally unevenly, with some edges partially submerged in melted mozzarella. Cold toppings added after baking remain distinct, resting naturally on the hot cheese.\n\nBefore baking apply PIZZETTA signature garlic margarine over the entire outer cornicione, including its upper and outside-facing dough surface, producing golden satin surface with small irregular blisters; never a postbake brush. Apply garlic margarine to pizza CENTER ONLY if explicitly present in this pizza recipe. No implied base ingredient.",

      "id": "N02-20",

      "markdown": "Samurai.\n\nSignature.\n\n14.\n\nPIZZA: Samurai\nSIZE INCHES: 14\nRECIPE: NO garlic margarine. SAMURAI ASSEMBLY FIDELITY: The red-white surimi kani is thick and chunky, unmistakably imitation-crab sticks with saturated crimson-red exterior patches and fibrous white interiors; cut diagonally with a Japanese bias cut into short substantial wedge-like bites, NOT pale smooth shrimp, thin julienne threads, or identical elongated fingers. These surimi pieces are baked with the pizza and therefore look lightly cooked and semi-submerged into the molten mozzarella rather than sitting raw and fully exposed on top. 14-inch portion uses approximately 90 g surimi in unevenly spaced pieces; individual surimi pieces retain visibly red skins and are partly embedded in molten 100 g mozzarella. The tomato base uses approximately 80 g hand-crushed tomato, not a smooth bright raw tomato field. ALL OTHER SAMURAI TOPPINGS ARE ADDED ONLY AFTER BAKING. AFTER baking, add a very generous, clearly abundant airy scattering of paper-thin curled translucent beige bonito flakes, at least 2x to 3x more abundant than a sparse garnish, concentrated in some loosely piled folds across the pizza rather than a few tiny isolated scraps. Add MANY clearly legible thin, matte, dry dark green-black nori strips lying loosely criss-crossed over the cheese and surimi, more abundant and visible than in a sparse generic garnish. Add fresh thinly sliced green onion leek rings, spread naturally across the top. Finish with TWO clearly distinct, prominent toppings: 30 g off-white Japanese mayonnaise in thicker, broader, glossy ribbons and 30 g dark brown shiny teriyaki in its own thicker glossy ribbons/streams; DIRECTIONAL TWO-SAUCE FINISHING — BOTH APPLIED AFTER BAKING: The glossy off-white Japanese mayonnaise forms ONE connected, broad, generous, hand-squeezed zigzag path that runs across the ENTIRE mozzarella-and-topping field, changing direction in wide smooth bends as it travels repeatedly fro       "markdown": "Creamy Chicken Pesto\n\nFOOD MORPHOLOGY\nPESTO COLOUR AND CONSISTENCY (CONFIRMED): Soft, moderately light creamy basil-green. Béchamel fully blended into pesto, giving a cohesive rich creamy coating on the spaghetti, never separate white patches. Remain recognizably basil-green, not pale white, fluorescent or watery. Long round durum-wheat spaghetti coated primarily in lighter medium olive-basil-green basil pesto, its natural basil-and-olive-oil colour unmistakable from a normal viewing distance. Béchamel is integrated thoroughly into the basil pesto as one cohesive creamy lighter medium basil-green sauce coating each spaghetti strand; natural variation is subtle light-olive-to-medium-green tonal depth, NEVER a separate pale or ivory substance. The whole sauce reads as one unified green coating, with no distinct second sauce layer. The sauce stays generously moist, thick and glossy, with occasional very small distinct transparent olive-oil highlights and delicate medium-green oily edges where the pesto has not perfectly emulsified with the béchamel; never a large greasy pool. Naturally irregular grilled chicken breast pieces: short torn tapered slivers and uneven flattened cut fragments, varied lengths and thicknesses, muted cooked grey-beige meat with faint subdued toasted edges, never round nuggets, perfect cubes, cylindrical pellets or uniformly golden chunks.\n\nINGREDIENTS AND PREPARATION\nCook basil pesto with its natural olive oil so it keeps a natural medium-light basil green; fully blend the béchamel into the pesto base before coating the spaghetti, creating one continuous lighter soft olive-basil-green creamy sauce; the cream remains wholly incorporated in the green base. The only mild phase separation permitted is a few minute transparent olive-oil glints at strand edges, never separate cream or milky pools. Chicken is cooked then cut or torn into flattened irregular small strips with authentic muted grey-beige flesh. Toss the chicken T       "markdown": "PHYSICAL SERVICE AND PLATING\n\nONE selected 10-inch special (Cheese Sticks or Choco Glaze) in the SAME commercial SMALL box CATEGORY used for 8-inch pizzas; directly on kraft, NO liner. Preserve the authentic 10-inch product size, recipe, ingredients and product-specific parallel seams plus ONE perpendicular middle cut as defined in N02. No triangular wedges and no removed pieces.\n\nBOX FIT / THREE-DIMENSIONAL PLATING — The 10-inch product is intentionally larger than the SMALL box's flat horizontal footprint. It is physically folded/curved to fit within the SMALL box, making use of the available vertical space (box height). The folded form must be plausible for the actual prepared food: retain the complete original product and its real 10-inch nominal diameter before folding. Do not shrink the food to 8 inches, enlarge the SMALL box, flatten the product unrealistically, or replace the real folded service with a rigid flat 10-inch disc. Do not prescribe an exact fold pattern or unprovided box measurements. This folding rule is specific to N03-04 and must NOT propagate to N03-02 (8-inch pizza).\n\nACCOMPANIMENTS — Cheese Sticks: exactly ONE plain opaque white hot-sauce sachet in an existing corner pocket, edge-on where physically possible without displacing the folded food. Choco Glaze: ZERO sachets and NO hot sauce. If actual fold geometry limits the available corner pocket, preserve the physical reality rather than inventing extra room.\n\nAUTHORITY — The 3D folding behavior is confirmed by the PIZZETTA owner as real operational packaging practice and supersedes the earlier mistaken rigid-disc feasibility hold. N02 product-specific cutting rules remain authoritative. N03-02 and N03-03 retain independent box contracts.\n\nRESPONSIBILITY AND PRECEDENCE\n\nN02 controls product identity, recipe, ingredients, preparation, product-specific quantities and cuts where explicitly assigned. N03 controls the physical vessel, its geometry, the arrangement and permitted accompaniments. N04 alone controls camera, POV, optical framing, lighting, focus, reflections, image appearance, postproduction and export. A change of POV must never modify the physical service. In case of source conflicts, do not silently merge quantities or invent missing measurements; record a production hold.",

      "markdown": "VESSEL GEOMETRY (N03 ONLY)\nVESSEL / FIXED PRODUCT IDENTITY: ONE real 8 US fluid ounce (237 mL nominal capacity) pressed transparent drinking tumbler, tall and slender, straight upright axis, circular open rim and sturdy clear glass contact base. Precisely TWO distinct wall treatments with one clean horizontal transition plane: the lower 2/3 of the TOTAL glass height (from bottom datum at 0.000H up to 0.667H) carries broad, rounded, evenly spaced VERTICAL press-molded convex panels; the upper 1/3 (from 0.667H up to the lip at 1.000H) is COMPLETELY smooth, continuous, cylindrical transparent glass with no flutes, ribs or vertical embossing. Exactly 66.7 percent faceted wall height and 33.3 percent smooth wall height, measured including the thick solid foot and rim in the total H. Individual facets are wide, shallow rounded vertical lens panels, extending down into the thick bottom region; no narrow sharp angular cut-crystal diamonds. The glass sides do not flare into a bucket or taper into a narrow tall vase. Bottom glass is thick and clear; no pedestal, stem, handle, lettering or garnish. Only the nominal 237 mL volume is established. No unverified millimeter dimensions may be invented.\n\nPHYSICAL FILL / ICE / COLD SURFACE\n- Exactly ONE selected transparent-glass vessel, upright, uncovered; no additional serving vessel, straw, garnish, fruit slices or props.\n- Partially melted, irregular, transparent ice occupies approximately ONE HALF of the vessel's interior volume as an ice loading specification, with credible displacement by the liquid; do not interpret half ice as half of the finished drink being empty.\n- The beverage and displaced ice sit below the rim / pouring lip with a visible natural headspace and credible liquid meniscus. Original source establishes headspace, not an exact numeric fill percentage: DO NOT invent a fixed fill-line percentage.\n- Cold transparent glass exterior has varied fine condensation droplets, some larger beads and occasional gravity-following rivulets; condensation adheres to the glass wall.\n- Physically correct glass thickness and continuous walls; the container is actually transparent, not frosted, colored, opaque or plastic.\n\nRESPONSIBILITY BOUNDARY\nN03 describes vessel geometry, ice quantity, occupancy, headspace and exterior condensation ONLY. N02 exclusively defines what Tropical Iced Tea is: recipe, color, pulp, suspended particles, turbidity and liquid optical density. N04 exclusively defines lighting, camera, glass refraction, caustics, cast shadows, focus and post-production. Do not transfer the tea recipe into this contract.",

      "markdown": "VESSEL GEOMETRY (N03 ONLY)\nONE clear-glass pitcher, nominal capacity 900 mL. Compact upright circular cylinder with perfectly smooth transparent walls from base to rim; no molded panels, flutes, ribs or scallops. One curved clear-glass handle and a modest integral pouring spout. Compact 0.9 L proportions, never an oversized 2 L jug. No lettering or ornament.\n\nPHYSICAL FILL / ICE / COLD SURFACE\n- Exactly ONE selected transparent-glass vessel, upright, uncovered; no additional serving vessel, straw, garnish, fruit slices or props.\n- Partially melted, irregular, transparent ice occupies approximately ONE HALF of the vessel's interior volume as an ice loading specification, with credible displacement by the liquid; do not interpret half ice as half of the finished drink being empty.\n- The beverage and displaced ice sit below the rim / pouring lip with a visible natural headspace and credible liquid meniscus. Original source establishes headspace, not an exact numeric fill percentage: DO NOT invent a fixed fill-line percentage.\n- Cold transparent glass exterior has varied fine condensation droplets, some larger beads and occasional gravity-following rivulets; condensation adheres to the glass wall.\n- Physically correct glass thickness and continuous walls; the container is actually transparent, not frosted, colored, opaque or plastic.\n\nRESPONSIBILITY BOUNDARY\nN03 describes vessel geometry, ice quantity, occupancy, headspace and exterior condensation ONLY. N02 exclusively defines what Tropical Iced Tea is: recipe, color, pulp, suspended particles, turbidity and liquid optical density. N04 exclusively defines lighting, camera, glass refraction, caustics, cast shadows, focus and post-production. Do not transfer the tea recipe into this contract.",

      "id": "N04-01",
      "node": "N04",
      "markdown": "CAMERA\n\nCAMERA / POV — MACRO FOOD SURFACE. Full-frame sensor; 100 mm macro lens; camera very close to the selected edible surface; optical axis near-perpendicular to the food plane; zero roll; f/8; ISO 1000. Fixed 4:5 portrait frame. Fill the crop with a continuous field of real food detail, not a whole-product view.\n\nPIZZA: show only the N02-authorized topping field; keep the cornicione and all crust outside the crop. Preserve natural topping distribution and real ingredient scale. Do not duplicate toppings to fill the frame.\nSALAD: show a close field of selected leaves and N02 toppings; keep leaf veins, edges, overlaps and actual dressing visible and sharply rendered.\nSPAGHETTI: show the actual coated strands and ingredients in a naturally settled section. No fork, lifted bite or action unless another selected contract authorizes it.\nLASAGNA: use a lateral camera position aligned with the naturally exposed layered face; show the existing pasta/filling layers sharply. Do not create a cut, remove a portion or alter N02/N03 geometry.\nTROPICAL ICED TEA: frame close to the N03 glass wall and actual ice. Show the N03-authorized exterior condensation and gravity-following rivulets. Keep glass, droplets, ice and liquid optically legible; do not add droplets, ice, fruit, vessels or props.\n\nFOCUS — Render nearly the entire visible food-detail plane critically sharp, with crisp, natural ingredient edges and high micro-detail. Allow only one subtle, physically plausible focus falloff at the single farthest edge of the frame; keep it small and gradual. Do not blur the foreground and background in separate bands. No broad shallow-focus blur, artificial bokeh, focus stacking, digital blur masks, simulated motion blur, oversharpening or clarity halos. For tea, keep most visible glass, condensation and ice sharply resolved, with only the far glass edge gently softening.\n\nVISUAL LOOK AND LIGHT\n\nVISUAL LOOK — MACRO FOOD CAMPAIGN. High-resolution, photorealistic close-up with strong local contrast and clean, natural detail. Use one strong directional side key from camera-left, shaping ingredient relief and casting defined, directional shadows across the food. Shadows remain deep and dimensional but retain color and texture. A restrained neutral fill keeps dark ingredients and crevices readable without flattening the key-light direction.\n\nWHITE BALANCE AND COLOR — Neutral-balanced whites. Cheese and pale ingredients remain natural ivory/cream, never yellow. Preserve ingredient-specific reds, greens, browns and pale tones from N02. Keep warm reflections localized to the actual lit surfaces; no global amber/yellow cast, orange wash or monochromatic grade. Bright specular highlights may approach white only in small areas on naturally reflective/moist surfaces; preserve surrounding texture and avoid broad clipping.\n\nREALISM — Preserve real irregularity in size, spacing, edge shape, gloss and browning as defined by the selected N02. Do not create repeated or cloned topping shapes, evenly repeated herb flecks, procedural pores, synthetic sauce beads, uniform glossy coating, artificial grain, or invented microtexture. Keep high detail clean and photographic, without plastic gloss, HDR artifacts or digital sharpening.\n\nTEA LIGHT — For Tropical Iced Tea only, retain neutral-balanced white balance and a strong lateral key. Let the light rake across the actual condensation and pass through the real glass and ice, visibly illuminating internal ice facets and preserving the selected tea color. Glass reflections and refraction must remain physically credible; no colored glow or background field.\n\nOUTPUT AND FIDELITY\n\n- 4:5 portrait macro crop; the selected food detail fills the image. No whole-product view.\n- Pizza: no crust or cornicione in frame.\n- True RGBA PNG. Any pixels outside the depicted subject and physically attached shadow are transparent.\n- N02 controls food identity, ingredients, quantities and preparation. N03 controls vessel and service. This contract controls macro camera, focus, lighting and photographic rendering only.\n- No table, backdrop, text, labels, watermark, unselected props, steam, smoke, mist or fog.",

      "id": "N04-02",
      "node": "N04",
      "markdown": "CAMERA\n\nCAMERA / POV — LOW HERO 15°. Full-frame sensor, optical axis 15° above the subject support plane, level roll. 160 mm full-frame lens; f/2.8; ISO 400 baseline; single-point focus on a narrow near-to-middle visible region of the actual food surface (for pizza, the front-to-mid cornicione and adjacent mozzarella/tomato region), never on an isolated decorative garnish. Only this near-to-middle focal island is critically sharp. Clear optical sharpness falloff across the pizza toward the far rim; the rear cornicione and distant toppings are noticeably softer than the selected focal island. Preserve a readable recipe, but do not render the entire pizza uniformly sharp. Strong, physically progressive optical defocus toward both extreme foreground and especially the far rear; smooth continuous transitions, no digital blur, no focus stacking, no all-over sharpening. Camera distance is adjusted to include the complete subject at the required magnification without changing focal length. Preserve the very low near-table perspective and visible upper food surface; do not elevate to a 35° view or turn it into a flat symmetrical frontal product render. 16:9 landscape frame, centered full subject, consistent safe margins on all four sides and balanced transparent negative space. For a pizza, show the entire uncut circular/organically oval disc and its complete far rim, without cropping the crust or filling the frame edge-to-edge. Subject geometry remains unchanged. No lighting, grading, ingredient or service instructions.\n\nHERO 15° — OPTICAL DEPTH-OF-FIELD ACCEPTANCE GATE\n\n- HERO15_FOCAL_ISLAND: the focal island is a narrow, physically coherent strip on the near-to-mid pizza surface and adjacent front cornicione; fine baked pores and cheese texture are sharply resolved ONLY there.\n- HERO15_REAR_DEFOCUS: the rear cornicione, rear toppings and far-side surface must be visibly, substantially softer than that focal island, with continuously increasing optical defocus over distance. Rear leopard spots must not retain the same crisp edge acuity as the front focal island. If front and rear are equally sharp, the render FAILS.\n- HERO15_NO_FAKE_BLUR: reproduce a shallow real-lens focus plane, not Gaussian post-blur, fake miniature tilt-shift, sharpening across the disc or all-in-focus product catalog rendering. Preserve the full outer pizza silhouette, with naturally soft far-edge anti-aliasing on true alpha; no backdrop is introduced to create bokeh.\n- HERO15_DISTANCE_PRIORITY: retain 160 mm, f/2.8, ISO 400 and the 15° axis. Frame the complete pizza by camera distance and 16:9 composition; do not sacrifice the visible near/far focus separation to obtain full-disc framing.\n\nVISUAL LOOK, LIGHTING, BACKGROUND AND OUTPUT\n\nVISUAL LOOK — HERO 15°. Directional warm key from high camera-left with restrained near-axis fill; dimensional contact shadow and gently feathered lower-right cast shadow. Golden selective specular intensity and deep natural shadows follow the shared signature; preserve realistic reflection/refraction. No camera, focus, lens, aperture, ISO, crop or physical product instructions.\n\nOUTPUT / BACKGROUND — Produce a true PNG with a real RGBA alpha channel. All background pixels outside the depicted subject and its physically plausible soft shadow have alpha = 0 (fully transparent); no solid-colored, checkerboard, white, black, gray, gradient, studio-wall or simulated transparent backdrop. Keep physically plausible contact and cast shadows as softly varying semi-transparent alpha where appropriate, never as an opaque background plane. Preserve clean natural anti-aliased subject edges without matte fringes. This requirement is a VISUAL LOOK output/background property and does not change the CAMERA aspect ratio or crop.\n\nPIZZETTA 2026 — SHARED PHOTOGRAPHIC SIGNATURE (OWNER-DIRECTED)\n\n- LIGHT_WARM_DIRECTIONAL: warm amber/golden directional illumination with pronounced three-dimensional modeling; retain the POV-specific key-light direction and fill placement already specified. Controlled-flash visual character, not a claim about the physical lighting instrument. Warm highlights rather than neutral-white flash. Preserve believable ingredient colors and material response.\n- HIGHLIGHT_GOLDEN_CLIP_SELECTIVE: intentionally very bright warm/golden specular highlights and localized selective overexposure on reflective surfaces, with natural highlight transitions; do not globally burn out food, erase ingredient texture, or introduce white glare blankets. Preserve physically credible aluminum, porcelain, cheese and glass response.\n- SHADOW_DEEP_NATURAL: deep, dimensional, naturally formed directional shadows, with restrained fill and plausible contact/cast geometry; no flat HDR shadow lifting or crushed featureless masses. Maintain the established POV-specific shadow direction and length.\n- TONAL_CURVE_NO_STRONG_S: no strong/aggressive RGB S-curve, no crunchy HDR, no halos, no artificial clarity. Perceived contrast comes chiefly from directional illumination and light/shadow separation; use restrained grading and smooth gradients, not a global high-contrast curve.\n- COLOR_WARM_AUTHENTIC: warm honey/amber/gold luminous atmosphere; recognizable recipe-specific ingredient colors, no uniform orange wash, no forced neutral-white speculars, no artificial oversaturation.\n- DOF_OPTICAL_PROGRESSIVE: honor this POV's existing lens, aperture and focus-plane specification. Natural progressive optical defocus only; no digitally painted blur, fake bokeh, focus stacking or indiscriminate full-frame sharpening. Hero profiles emphasize shallow depth of field; macro, overhead and tray profiles retain their specified depth of field.\n- SUBJECT_FULL_FRAME_SAFE: wherever the POV requires the whole product/vessel/tray, keep its entire silhouette and specified safe margins, without cropping or geometry changes. The N04-01 macro is the explicit exception: intentional detail cropping remains permitted.\n- NO_STEAM_NO_VAPOR: no visible steam, vapor, smoke, mist, fog or atmospheric plume in any product render; no exceptions for hot dishes. This is a visual-output restriction, not a change to recipe or cooking state.\n- ALPHA_OUTPUT_LOCK: final output remains genuine transparent RGBA PNG. No photographed, generated, blurred, gradient or opaque background; warm directional lighting, optical depth and tonal character are fully specified in text. Any soft shadows or glass caustics must remain physically plausible semi-transparent foreground-associated effects on alpha, never a background layer.\n\nRENDER FAILURE PREVENTION — PHYSICAL ALPHA / NO BACKDROP\n\n- ALPHA_QA_GATE: deliver a real PNG encoded with an alpha channel (RGBA), not merely a PNG extension. Outside the food/vessel and physically attached shadow, pixels MUST have alpha=0. Preserve a nonempty transparent border and transparent corners. No black, brown, amber, white, gray, gradient, blurred restaurant interior, simulated studio sweep, checkerboard texture or atmospheric fog layer behind the product. A visually dark backdrop is a FAIL even if the product is attractive. Do not flatten against any matte.\n- WARM_LIGHT_WITHOUT_BACKGROUND: warm golden directional illumination and specular overexposure must be expressed ONLY on the product's physical surfaces and permissible translucent effects. Do not create an amber glow field or background to demonstrate warmth. Deep shadows are material/occlusion shadows, not a solid black stage.\n- FOCUS_QA_GATE: retain the selected POV's focal-plane and progressive optical depth of field. For low Hero 15°, the near-to-mid food focal island is sharp, with visibly softer far rim; no uniform edge-to-edge crispness. For other POVs, preserve their original optical depth-of-field specifications rather than forcing shallow Hero DOF.\n- COMPOSITION_QA_GATE: for every non-macro whole-subject shot, preserve complete product silhouette and breathing room on all four sides. For pizza Hero 15°, keep the camera genuinely low; do not solve framing by lifting the camera or cropping the near crust.\n- RECIPE_QA_GATE: N02 ingredient identity, timing, garnish exclusions, and exact quantities outrank decorative photographic styling. Do not add fresh basil, garnish, herbs, vessels or props merely to make the picture more attractive. No atmospheric effects are allowed.\n\n<!-- TEA_GLASS_OPTICS_START -->\nConditional photographic glass optics — only for Tropical Iced Tea in glass / pitcher\n- Directional light must refract through the actual transparent glass wall, ice and semi-opaque liquid with physically credible Fresnel reflections, specular highlights, transmission and light bending.\n- Long cast shadows of the transparent vessel must contain physically plausible elongated refracted-light caustics: subtle prismatic light projections and localized luminous patterns generated by the glass and ice. Do not use generic solid opaque shadows, invented rainbow decorations, artificial glow or fake floor/background.\n- Respect the chosen N04 POV, lens, focus, light direction, global visual look and transparent RGBA output; this is a conditional optical-material treatment, not a new lighting rig.\n<!-- TEA_GLASS_OPTICS_END -->",

      "markdown": "CAMERA\n\nCAMERA / POV — HERO 35°. Full-frame sensor, optical axis 35° above the support plane, level roll. 160 mm full-frame lens; f/2.8; ISO 400 baseline; one narrow critically sharp central visible focal region. Strong but continuous natural optical depth falloff toward foreground and rear, with rear blur conspicuous; smooth optical transitions, no digital blur or focus stacking. Camera distance adjusts to frame the entire physical subject. Square 1:1 composition, centered silhouette, consistent safe margins and negative space. No lighting, grading, ingredient or service instructions.\n\nVISUAL LOOK, LIGHTING, BACKGROUND AND OUTPUT\n\nVISUAL LOOK — HERO 35°. Directional warm camera-left key with restrained near-axis fill; retain physically soft contact occlusion and feathered cast shadow, but make highlight/shadow separation more expressive without a strong tonal S-curve. Preserve realistic material reflection/refraction. No camera, focus, lens, aperture, ISO, crop or physical product instructions.\n\nOUTPUT / BACKGROUND — Produce a true PNG with a real RGBA alpha channel. All background pixels outside the depicted subject and its physically plausible soft shadow have alpha = 0 (fully transparent); no solid-colored, checkerboard, white, black, gray, gradient, studio-wall or simulated transparent backdrop. Keep physically plausible contact and cast shadows as softly varying semi-transparent alpha where appropriate, never as an opaque background plane. Preserve clean natural anti-aliased subject edges without matte fringes. This requirement is a VISUAL LOOK output/background property and does not change the CAMERA aspect ratio or crop.\n\nPIZZETTA 2026 — SHARED PHOTOGRAPHIC SIGNATURE (OWNER-DIRECTED)\n\n- LIGHT_WARM_DIRECTIONAL: warm amber/golden directional illumination with pronounced three-dimensional modeling; retain the POV-specific key-light direction and fill placement already specified. Controlled-flash visual character, not a claim about the physical lighting instrument. Warm highlights rather than neutral-white flash. Preserve believable ingredient colors and material response.\n- HIGHLIGHT_GOLDEN_CLIP_SELECTIVE: intentionally very bright warm/golden specular highlights and localized selective overexposure on reflective surfaces, with natural highlight transitions; do not globally burn out food, erase ingredient texture, or introduce white glare blankets. Preserve physically credible aluminum, porcelain, cheese and glass response.\n- SHADOW_DEEP_NATURAL: deep, dimensional, naturally formed directional shadows, with restrained fill and plausible contact/cast geometry; no flat HDR shadow lifting or crushed featureless masses. Maintain the established POV-specific shadow direction and length.\n- TONAL_CURVE_NO_STRONG_S: no strong/aggressive RGB S-curve, no crunchy HDR, no halos, no artificial clarity. Perceived contrast comes chiefly from directional illumination and light/shadow separation; use restrained grading and smooth gradients, not a global high-contrast curve.\n- COLOR_WARM_AUTHENTIC: warm honey/amber/gold luminous atmosphere; recognizable recipe-specific ingredient colors, no uniform orange wash, no forced neutral-white speculars, no artificial oversaturation.\n- DOF_OPTICAL_PROGRESSIVE: honor this POV's existing lens, aperture and focus-plane specification. Natural progressive optical defocus only; no digitally painted blur, fake bokeh, focus stacking or indiscriminate full-frame sharpening. Hero profiles emphasize shallow depth of field; macro, overhead and tray profiles retain their specified depth of field.\n- SUBJECT_FULL_FRAME_SAFE: wherever the POV requires the whole product/vessel/tray, keep its entire silhouette and specified safe margins, without cropping or geometry changes. The N04-01 macro is the explicit exception: intentional detail cropping remains permitted.\n- NO_STEAM_NO_VAPOR: no visible steam, vapor, smoke, mist, fog or atmospheric plume in any product render; no exceptions for hot dishes. This is a visual-output restriction, not a change to recipe or cooking state.\n- ALPHA_OUTPUT_LOCK: final output remains genuine transparent RGBA PNG. No photographed, generated, blurred, gradient or opaque background; warm directional lighting, optical depth and tonal character are fully specified in text. Any soft shadows or glass caustics must remain physically plausible semi-transparent foreground-associated effects on alpha, never a background layer.\n\nRENDER FAILURE PREVENTION — PHYSICAL ALPHA / NO BACKDROP\n\n- ALPHA_QA_GATE: deliver a real PNG encoded with an alpha channel (RGBA), not merely a PNG extension. Outside the food/vessel and physically attached shadow, pixels MUST have alpha=0. Preserve a nonempty transparent border and transparent corners. No black, brown, amber, white, gray, gradient, blurred restaurant interior, simulated studio sweep, checkerboard texture or atmospheric fog layer behind the product. A visually dark backdrop is a FAIL even if the product is attractive. Do not flatten against any matte.\n- WARM_LIGHT_WITHOUT_BACKGROUND: warm golden directional illumination and specular overexposure must be expressed ONLY on the product's physical surfaces and permissible translucent effects. Do not create an amber glow field or background to demonstrate warmth. Deep shadows are material/occlusion shadows, not a solid black stage.\n- FOCUS_QA_GATE: retain the selected POV's focal-plane and progressive optical depth of field. For low Hero 15°, the near-to-mid food focal island is sharp, with visibly softer far rim; no uniform edge-to-edge crispness. For other POVs, preserve their original optical depth-of-field specifications rather than forcing shallow Hero DOF.\n- COMPOSITION_QA_GATE: for every non-macro whole-subject shot, preserve complete product silhouette and breathing room on all four sides. For pizza Hero 15°, keep the camera genuinely low; do not solve framing by lifting the camera or cropping the near crust.\n- RECIPE_QA_GATE: N02 ingredient identity, timing, garnish exclusions, and exact quantities outrank decorative photographic styling. Do not add fresh basil, garnish, herbs, vessels or props merely to make the picture more attractive. No atmospheric effects are allowed.\n\n<!-- TEA_GLASS_OPTICS_START -->\nConditional photographic glass optics — only for Tropical Iced Tea in glass / pitcher\n- Directional light must refract through the actual transparent glass wall, ice and semi-opaque liquid with physically credible Fresnel reflections, specular highlights, transmission and light bending.\n- Long cast shadows of the transparent vessel must contain physically plausible elongated refracted-light caustics: subtle prismatic light projections and localized luminous patterns generated by the glass and ice. Do not use generic solid opaque shadows, invented rainbow decorations, artificial glow or fake floor/background.\n- Respect the chosen N04 POV, lens, focus, light direction, global visual look and transparent RGBA output; this is a conditional optical-material treatment, not a new lighting rig.\n<!-- TEA_GLASS_OPTICS_END -->",

    const dimension=lines.slice(1,5).map(x=>normalize(x).replace(/[.]+$/,'')).find(x=>/\b\d+(?:\.\d+)?\s*[- ]?(?:inches|inch|in\b|cm|mm)\b|\bspecial\s+\d+[- ]?inch\b/i.test(x));
    return groupCount > 1 ? (dimension || c.id) : (dimension || 'Single');
  };
  const statusClass = (status) => {
    if (status === 'SPEC_APPROVED' || status === 'APPROVED') return 'approved';
    if (String(status||'').includes('USER_SPECIFIED')) return 'user';
    if (String(status||'').includes('REVIEW')) return 'review';
    return '';
  };
  const allContracts = () => state.dataset ? [...state.dataset.contracts, ...state.extras] : [];
  const byId = (id) => allContracts().find(c=>c.id===id);
  const familyOf = (c) => {
    const keys = Array.isArray(c.source_keys) ? c.source_keys : [];
    for (const family of Object.keys(studioPrefix)) if (keys.some(k=>String(k).startsWith(studioPrefix[family]))) return family;
    return '';
  };
  const n02ForStudio = () => allContracts().filter(c=>c.node==='N02' && familyOf(c)===state.studio);
  const productGroups = () => {
    const map = new Map();
    for (const c of n02ForStudio()) {
      let name = productName(c) || c.id;
      if(state.studio==='kitchen'){
        const key=(c.source_keys||[]).join('|').toLowerCase();
        name=/alfredo|apizzetta|pesto/.test(key)?'Spaghetti':/lasagna/.test(key)?'Lasagna':'Salad';
      }
      if (!map.has(name)) map.set(name, []);
      map.get(name).push(c);
    }
    return map;
  };
  const pizzaProductOrder = ['Margherita','Pepperoni','Hawaiian','Spinach','Five Cheese','Vegetarian','Meat Overload','Pizza Corn','Pizzalada','Chicken Masala','Samurai','Longanisa BBQ','Chicken Suya','Cheese Sticks','Choco Glaze'];
  const productDisplayName = (name) => {
    if(state.studio==='pizza')return ({'Spinach':'Spinach Dip','Meat Overload':'All Meat','Longanisa BBQ':'BBQ Longanisa'})[name] || name;
    if(state.studio==='kitchen')return name;
    if(state.studio==='tea')return 'BrewedIcedTea';
    return name;
  };
  const orderedProducts = (groups) => [...groups.entries()].sort((a,b)=>{
    const kitchenOrder=['Spaghetti','Lasagna','Salad'];
    const order=state.studio==='pizza'?pizzaProductOrder:state.studio==='kitchen'?kitchenOrder:null;
    if(!order)return 0;
    const canonical=(name)=>name.toLowerCase().replace(/[^a-z0-9]/g,'');
    const ai=order.findIndex(x=>canonical(x)===canonical(productDisplayName(a[0]))), bi=order.findIndex(x=>canonical(x)===canonical(productDisplayName(b[0])));
    return (ai<0?999:ai)-(bi<0?999:bi);
  });
  const currentN02Choices = () => productGroups().get(state.productKey) || [];
  const nodeCandidates = (node) => allContracts().filter(c=>c.node===node);
  const selected = () => {
    if (!state.dataset) return [];
    const n02 = currentN02Choices().find(c=>c.id===state.variantId);
    const ids = { N02:n02?.id, N03:state.n03Id, N04:state.n04Id };
    return state.dataset.architecture.assembly_order.map(node=>{
      if (node==='N02') return ids.N02 ? byId(ids.N02) : null;
      if (node==='N03') return ids.N03 ? byId(ids.N03) : null;
      if (node==='N04') return ids.N04 ? byId(ids.N04) : null;
      const found=nodeCandidates(node);
      return found.length===1 ? found[0] : null;
    });
  };
  const chosen = () => selected().filter(Boolean);
  const getIntegrity = (c) => state.hashes.get(c.id) || 'pending';
  const missingNodes = () => selected().map((c,i)=>c?null:state.dataset.architecture.assembly_order[i]).filter(Boolean);
  const integrityErrors = () => chosen().filter(c=>getIntegrity(c)==='mismatch');
  const integrityPending = () => chosen().some(c=>getIntegrity(c)==='pending');
  const isReady = () => !!state.dataset && missingNodes().length===0 && integrityErrors().length===0 && !integrityPending();

  function setSourceMessage(message, kind='') {
    const el=$('sourceStatus'); if(!el)return; el.textContent=message; el.className='source-status'+(kind?' '+kind:'');
  }
  function setStatus(message, kind='') {
    const el=$('status'); el.textContent=message; el.className='status'+(kind?' '+kind:'');
  }
  function setWarning(message='') {
    const box=$('warningBox'); box.textContent=message; box.classList.toggle('show',!!message);
  }
  function updateTabs() {
    document.querySelectorAll('.tab[data-studio]').forEach(tab=>{
      const active=tab.dataset.studio===state.studio;
      tab.setAttribute('aria-selected',String(active));
    });
  }
  function renderProducts() {
    const host=$('products'), groups=productGroups(); host.replaceChildren();
    if (!groups.has(state.productKey)) state.productKey='';
    for(const [name] of orderedProducts(groups)){
      const b=document.createElement('button'); b.type='button'; b.className='choice'+(state.productKey===name?' active':'');
      b.setAttribute('role','radio'); b.setAttribute('aria-checked',String(state.productKey===name));
      b.innerHTML=`<span class="choice-label">${esc(productDisplayName(name))}</span>`;
      b.addEventListener('click',()=>{
        const previous=currentN02Choices().find(c=>c.id===state.variantId);
        const previousVariant=previous?variantLabel(previous,currentN02Choices().length):'';
        state.productKey=name;
        const next=currentN02Choices();
        const same=next.find(c=>variantLabel(c,next.length)===previousVariant);
        state.variantId=same?.id||(next.length===1?next[0].id:'');
        render();
      }); host.appendChild(b);
    }
    renderVariants();
  }
  function renderVariants() {
    const group=currentN02Choices(), box=$('variantGroup'), host=$('variants');
    host.replaceChildren();
    if (!state.productKey || !group.length) { box.hidden=true; state.variantId=''; return; }
    box.hidden=false;
    if(group.length===1&&!state.variantId)state.variantId=group[0].id;
    for (const c of group) {
      const b=document.createElement('button'); b.type='button'; b.className='choice'+(state.variantId===c.id?' active':'');
      b.setAttribute('role','radio'); b.setAttribute('aria-checked',String(state.variantId===c.id));
      b.innerHTML=`<span class="choice-label">${esc(state.studio==='kitchen'?kitchenVariantLabel(c):variantLabel(c,group.length))}</span>`;
      b.addEventListener('click',()=>{state.variantId=c.id;render();}); host.appendChild(b);
    }
    if (!group.some(c=>c.id===state.variantId)) state.variantId='';
  }
  function kitchenVariantLabel(c){return ({'N02-29':'Spaghetti Alfredo','N02-30':'Spaghetti A’la Pizzetta','N02-34':'Spaghetti Creamy Chicken Pesto','N02-33':'Lasagna','N02-31':'Caesar Salad','N02-32':'Kani Salad'})[c.id]||productName(c);}
  function choiceButton(c, node, active, flavor='') {
    const b=document.createElement('button'); b.type='button'; b.className='choice'+(flavor?' '+flavor:'')+(active?' active':'');
    b.setAttribute('role','radio'); b.setAttribute('aria-checked',String(active));
    const title=contractTitle(c)||c.id;
    const short=title.replace(/\b(CAMERA\s*\/\s*POV|VISUAL LOOK|PLATING|SERVICE|VESSEL GEOMETRY)\s*[—:-]?/ig,'').replace(/\s+/g,' ').trim();
    const label=node==='N03'?serviceLabel(c.id):lookLabel(c.id,short);
    b.innerHTML=`<span class="choice-label">${esc(label)}</span>`;
    b.addEventListener('click',()=>{if(node==='N03')state.n03Id=c.id;else state.n04Id=c.id;render();});
    return b;
  }
  function selectedSourceKey(){const c=currentN02Choices().find(x=>x.id===state.variantId);return (c?.source_keys||[]).join('|').toLowerCase();}
  function serviceLabel(id){return ({'N03-01':'Whole','N03-02':'8 in · Box','N03-03':'14 in · Box','N03-04':'10 in · Box','N03-05':'Plate','N03-06':'Tray','N03-07':'Plate','N03-08':'Tray','N03-09':'Plate','N03-10':'Tray','N03-11':'Glass','N03-12':'Pitcher'})[id]||id;}
  function lookLabel(id,title){if(state.studio==='tea'&&id==='N04-09')return 'Tea top-down';const fixed=({'N04-01':'Macro','N04-02':'15°','N04-03':'35°','N04-04':'90°','N04-05':'Low-up','N04-06':'Tray · 45°','N04-07':'Tray · 62°','N04-08':'Action','N04-09':'Top-down','N04-10':'Hero · 45°','N04-11':'Macro','N04-12':'Plate hold'});return fixed[id]||title||id;}
  function availableN03(){
    if(!state.variantId)return [];
    const key=selectedSourceKey();
    if(state.studio==='pizza'){
      const out=['N03-01'];
      if(/(?:corn|pizza).*8|8inch/.test(key))out.push('N03-02');
      else if(/(?:corn|pizza).*14|14inch/.test(key))out.push('N03-03');
      else if(/(?:choco|cheese).*10|special10/.test(key))out.push('N03-04');
      return out.map(byId).filter(Boolean);
    }
    if(state.studio==='tea')return ['N03-11','N03-12'].map(byId).filter(Boolean);
    const product=key;
    if(/spaghetti|alfredo|pasta/.test(product))return ['N03-05','N03-06'].map(byId).filter(Boolean);
    if(/lasagna/.test(product))return ['N03-07','N03-08'].map(byId).filter(Boolean);
    if(/salad|kani|caesar/.test(product))return ['N03-09','N03-10'].map(byId).filter(Boolean);
    return [];
  }
  function availableN04(){
    if(!state.variantId||!state.n03Id)return [];
    const tray=['N03-06','N03-08','N03-10'].includes(state.n03Id), plate=['N03-05','N03-07','N03-09'].includes(state.n03Id);
    if(state.studio==='tea')return ['N04-01','N04-03','N04-04','N04-09'].map(byId).filter(Boolean);
    return nodeCandidates('N04').filter(c=>{
      if(['N04-06','N04-07'].includes(c.id))return tray;
      if(c.id==='N04-05')return state.studio==='tea';
      if(c.id==='N04-08')return state.studio==='kitchen'&&/spaghetti|alfredo|pasta|salad|kani|caesar|lasagna/.test(selectedSourceKey());
      if(c.id==='N04-12')return plate;
      return ['N04-01','N04-02','N04-03','N04-04','N04-09','N04-10','N04-11'].includes(c.id)||/^N04-1[3-9]|^N04-[2-9]\d/.test(c.id);
    });
  }
  function renderNodeChoices(node, targetId, flavor='') {
    const host=$(targetId); host.replaceChildren();
    if(node==='N03'&&!state.variantId){$('conceptGroup').hidden=true;return;}
    const candidates=node==='N03'?availableN03():availableN04();
    for (const c of candidates) host.appendChild(choiceButton(c,node,(node==='N03'?state.n03Id:state.n04Id)===c.id,flavor));
    if(node==='N03')$('conceptGroup').hidden=!candidates.length;
    if(node==='N03'&&!candidates.some(c=>c.id===state.n03Id)){state.n03Id='';}
    if(node==='N04'&&!candidates.some(c=>c.id===state.n04Id))state.n04Id='';
  }
  function renderFixedNodes() {
    const host=$('selection');
    const fixed=state.dataset.architecture.assembly_order.filter(n=>!['N02','N03','N04'].includes(n));
    const bits=fixed.map(node=>{
      const list=nodeCandidates(node), c=list.length===1?list[0]:null;
      if(!c)return `<span class="badge">${esc(node)} · choose one</span>`;
      return `<span class="badge ${statusClass(c.status)}">${esc(node)} · auto · ${esc(statusLabels[c.status]||c.status||'status absent')}</span>`;
    });
    const picked=chosen().filter(c=>['N02','N03','N04'].includes(c.node));
    const keys=picked.flatMap(c=>Array.isArray(c.source_keys)?c.source_keys:[]);
    host.innerHTML=`<div><strong>Fixed modules:</strong> ${bits.join(' ')||'none'}</div><div style="margin-top:5px"><strong>Selected:</strong> ${picked.map(c=>`<span class="badge ${statusClass(c.status)}">${esc(c.id)}</span>`).join(' ')||'No N02/N03/N04 modules selected yet.'}</div>${keys.length?`<div style="margin-top:5px"><strong>Source mapping:</strong> ${keys.map(esc).join(' · ')}</div>`:''}`;
  }
  function renderTrace() {
    const host=$('traceList'), cs=chosen();
    if(!cs.length){host.textContent='No contracts selected.';return;}
    host.innerHTML=cs.map(c=>{
      const integrity=getIntegrity(c);
      const src=(Array.isArray(c.source_keys)&&c.source_keys.length)?c.source_keys.join(' · '):'No source_keys in contract';
      const hash=integrity==='ok'?'source SHA-256 verified':integrity==='computed'?'local SHA-256 calculated; no source hash':integrity==='mismatch'?'SHA-256 MISMATCH':integrity==='unavailable'?'SHA-256 unavailable':'No SHA-256 supplied';
      return `<div>${esc(c.node)} / ${esc(c.id)} / ${esc(c.status||'STATUS_UNSTATED')} / ${esc(hash)}<br>${esc(src)}</div>`;
    }).join('<br>');
  }
  function buildExactPrompt() {
    const cs=selected();
    if(cs.some(c=>!c)) return '';
    return cs.map(c=>c.markdown).join('\n\n');
  }
  function renderPromptAfterSelection() {
    state.compiled=buildExactPrompt();
    if(!state.manualEdit) $('prompt').value=state.compiled;
    else if(state.compiled!==$('prompt').value) setWarning('Your prompt contains manual edits. The contract selection has changed; Restore compiled replaces the editor with the exact current assembly.');
    renderControls();
  }
  function renderControls() {
    const ready=isReady(), cs=chosen(), errors=integrityErrors();
    $('copyButton').disabled=!ready;
    $('count').textContent=`${$('prompt').value.length.toLocaleString()} characters`;
    $('editState').textContent=state.manualEdit?'Manual edit · source text changed':'Compiled from selected contracts';
    $('integritySummary').textContent=errors.length?`${errors.length} selected hash mismatch${errors.length===1?'':'es'}`:cs.length?`${cs.length} of ${state.dataset.architecture.assembly_order.length} modules selected`:'No prompt assembled';
    if(state.dataset){
      const missing=missingNodes();
      if(errors.length){setStatus('Copy disabled: a selected Markdown block does not match its supplied SHA-256.','error');setWarning('Integrity mismatch. Re-import the correct Master JSON or correct the source contract before copying.');}
      else if(integrityPending()){setStatus('Checking source hashes before enabling Copy.','warn');setWarning('');}
      else if(missing.length){setStatus(`Select the required module${missing.length===1?'':'s'}: ${missing.join(', ')}.`,'warn');if(!$('warningBox').classList.contains('show'))setWarning('');}
      else {
        const pending=cs.filter(c=>String(c.status||'').includes('REVIEW'));
        setStatus(pending.length?`${pending.length} selected contract${pending.length===1?' is':'s are'} marked for review in the source. Prompt remains available for visual evaluation.`:'All selected modules are assembled in source order.','ok');
        if(!$('warningBox').textContent.startsWith('Your prompt contains manual edits')) setWarning(pending.length?`${pending.map(c=>c.id).join(', ')} carry review status in Master 56. The compiler preserves that status and does not silently approve them.`:'');
      }
    } else {setStatus('Load the Master 56 JSON to assemble a prompt.');setWarning('');}
    renderTrace();
  }
  function render() {
    const loaded=!!state.dataset;
    $('builderContent').hidden=!loaded; $('emptyBuilder').hidden=loaded;
    updateTabs();
    if(!loaded){$('prompt').value='';state.compiled='';state.manualEdit=false;renderControls();return;}
    renderProducts();
    renderNodeChoices('N03','concepts');
    renderLookGroups();
    state.compiled=buildExactPrompt();
    if(!state.manualEdit) $('prompt').value=state.compiled;
    renderControls();
  }
  function renderLookGroups(){
    if(!state.variantId||!state.n03Id){$('povLooks').replaceChildren();$('visualLooks').replaceChildren();$('povLookGroup').hidden=true;$('visualLookGroup').hidden=true;$('lookGroup').hidden=true;return;}
    const candidates=availableN04();
    const pov=candidates.filter(c=>/^N04-0[1-7]$/.test(c.id));
    const looks=candidates.filter(c=>!/^N04-0[1-7]$/.test(c.id));
    const povHost=$('povLooks'),lookHost=$('visualLooks');povHost.replaceChildren();lookHost.replaceChildren();
    pov.forEach(c=>povHost.appendChild(choiceButton(c,'N04',state.n04Id===c.id,'look')));
    looks.forEach(c=>lookHost.appendChild(choiceButton(c,'N04',state.n04Id===c.id,'look')));
    $('povLookGroup').hidden=!pov.length;$('visualLookGroup').hidden=!looks.length;$('lookGroup').hidden=!candidates.length;
    if(!candidates.some(c=>c.id===state.n04Id))state.n04Id='';
  }
  function onSelectionChange(applyChange){
    state.manualEdit=false;if(applyChange)applyChange();setWarning('');render();
  }
  function validateDataset(raw) {
    if(!raw || typeof raw!=='object' || !Array.isArray(raw.contracts) || !raw.architecture || !Array.isArray(raw.architecture.assembly_order)) {
      throw new Error('This is not a Master 56 contract file. Load PIZZETTA_MASTER_56.json; raw Studios source JSON is intentionally not compiled here.');
    }
    if(raw.schema && raw.schema!=='pizzetta.contracts.v1') throw new Error(`Unsupported schema: ${raw.schema}`);
    if(!raw.architecture.assembly_order.length) throw new Error('assembly_order is empty.');
    const ids=new Set(), order=new Set(raw.architecture.assembly_order);
    for(const c of raw.contracts){
      if(!c || typeof c.id!=='string' || typeof c.node!=='string' || typeof c.markdown!=='string') throw new Error('Every contract must have string id, node and markdown fields.');
      if(ids.has(c.id)) throw new Error(`Duplicate contract ID: ${c.id}`);
      ids.add(c.id);
      if(!order.has(c.node)) throw new Error(`Contract ${c.id} belongs to node ${c.node}, which is absent from assembly_order.`);
      if(c.source_keys!==undefined && !Array.isArray(c.source_keys)) throw new Error(`source_keys must be an array in ${c.id}.`);
    }
    for(const node of order){if(!raw.contracts.some(c=>c.node===node))throw new Error(`No contracts found for required node ${node}.`);}
    return raw;
  }
  async function digest(text) {
    if(!globalThis.crypto || !crypto.subtle || !globalThis.TextEncoder) return null;
    const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  async function verifyHashes() {
    state.hashes.clear();
    const cs=allContracts();
    for(const c of cs){
      if(!c.sha256){
        if(c._externalDraft){try{const actual=c.computed_sha256||await digest(c.markdown);c.computed_sha256=actual||'';state.hashes.set(c.id,actual?'computed':'unavailable');}catch{state.hashes.set(c.id,'unavailable');}}
        else state.hashes.set(c.id,'missing');
        continue;
      }
      try{const actual=await digest(c.markdown);state.hashes.set(c.id,actual===null?'unavailable':actual.toLowerCase()===String(c.sha256).toLowerCase()?'ok':'mismatch');}
      catch{state.hashes.set(c.id,'unavailable');}
    }
    renderControls();
  }
  async function applyDataset(raw,fileName,isBundled=false) {
    const valid=validateDataset(raw);
    state.dataset=valid;state.fileName=fileName;state.isBundled=isBundled;state.hashes.clear();
    state.extras=bundledDrafts.filter(d=>!valid.contracts.some(c=>c.id===d.id)).map(d=>({...d,node:'N04',source_keys:[],sha256:'',computed_sha256:'',_externalDraft:true}));
    state.productKey='';state.variantId='';state.n03Id='';state.n04Id='';state.manualEdit=false;state.ready=true;
    const draftLabel=state.extras.length?` · ${state.extras.length} supplemental N04 drafts`:'';
    setSourceMessage(`${fileName} · ${valid.contracts.length} Master contracts${draftLabel} · ${valid.architecture.assembly_order.join(' → ')}`,'');
    setStatus(isBundled?'Embedded Master 56 loaded read-only. Choose one N02 product, one N03 service contract and one N04 view.':'Updated Master loaded read-only. Bundled N04 drafts remain separate.');
    render();await verifyHashes();
  }
  async function loadJson(file) {
    try{
      const text=await file.text();
      await applyDataset(JSON.parse(text),file.name,false);
    }catch(err){setStatus(err.message||'Unable to read this file.','error');setSourceMessage(`Import failed · ${err.message||'Invalid Master JSON'}`,'error');}
  }
  async function restoreEmbeddedMaster() {
    if(!bundledMaster){setStatus('Embedded Master data is missing or invalid.','error');return;}
    try{state.studio='pizza';await applyDataset(bundledMaster,'Embedded PIZZETTA_MASTER_56.json',true);setStatus('Embedded Master 56 restored read-only.','ok');}
    catch(err){setStatus(`Embedded Master error · ${err.message}`,'error');}
  }
  async function loadSupplement(file) {
    if(!state.dataset){setStatus('Load Master 56 before adding an N04 draft.','warn');return;}
    try{
      const markdown=await file.text();
      const titleLine=markdown.split(/\r?\n/).find(x=>/^#\s+N04-\d{2}\b/.test(x.trim()));
      if(!titleLine)throw new Error('Draft must start with a heading such as “# N04-08 — Kitchen Action Hero”.');
      const id=titleLine.trim().match(/^#\s+(N04-\d{2})\b/)[1];
      if(allContracts().some(c=>c.id===id))throw new Error(`${id} already exists. The compiler will not overwrite a Master contract or merge a fragment into it.`);
      const title=titleLine.trim().replace(/^#\s+N04-\d{2}\s*[—-]?\s*/,'');
      const statusMatch=markdown.match(/^\*\*Status:\*\*\s*(.+)$/m);
      const status=statusMatch?statusMatch[1].trim().toUpperCase().replace(/[^A-Z0-9_ -]/g,''):'DRAFT';
      const sha=await digest(markdown);
      const extra={id,node:'N04',status,source_keys:[],sha256:'',computed_sha256:sha||'',markdown,_title:title,_externalDraft:true};
      state.extras.push(extra);state.hashes.set(id,sha?'computed':'unavailable');
      setStatus(`${id} added as a separate ${status} contract. It is not selected automatically.`,'warn');
      render();
    }catch(err){setStatus(err.message||'Unable to add this Markdown file.','error');}
  }
  function fallbackCopy(text) {
    const area=$('prompt'); area.focus();area.select();area.setSelectionRange(0,area.value.length);
    const ok=document.execCommand('copy');window.getSelection()?.removeAllRanges();return ok;
  }
  async function copyPrompt() {
    if(!isReady())return;
    const text=$('prompt').value;
    try{if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(text);else if(!fallbackCopy(text))throw new Error('Clipboard unavailable');
      const b=$('copyButton');b.textContent='Copied';window.setTimeout(()=>b.textContent='Copy prompt',1200);
    }catch{if(fallbackCopy(text)){const b=$('copyButton');b.textContent='Copied';window.setTimeout(()=>b.textContent='Copy prompt',1200);}else setStatus('Copy failed.','error');}
  }

  document.querySelectorAll('.tab[data-studio]').forEach(tab=>tab.addEventListener('click',()=>{
    if(!state.dataset)return;
    state.manualEdit=false;state.studio=tab.dataset.studio;state.productKey='';state.variantId='';setWarning('');render();
  }));
  $('copyButton').addEventListener('click',copyPrompt);
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!$('copyButton').disabled){e.preventDefault();copyPrompt();}});
  if(bundledMaster) applyDataset(bundledMaster,'Embedded PIZZETTA_MASTER_56.json',true).catch(err=>{setSourceMessage(`Embedded Master error · ${err.message}`,'error');setStatus('The embedded Master could not be loaded.','error');});
  else {render();setSourceMessage('Embedded Master data is missing or invalid.','error');}
})();
</script>
